<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO -->
  <title>MJ • Builder, Developer</title>
  <meta name="description" content="Building at the intersection of software, AI infrastructure, and entrepreneurship. Ships things that matter.">
  <meta name="author" content="MJ">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://mayoka.dev/">

  <!-- Theme Color (mobile browser chrome) -->
  <meta name="theme-color" content="#0a0808">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph (Facebook, iMessage, LinkedIn, etc.) -->
  <meta property="og:title" content="MJ • Builder, Developer">
  <meta property="og:description" content="Building at the intersection of software, AI infrastructure, and entrepreneurship. Ships things that matter.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mayoka.dev/">
  <meta property="og:site_name" content="MJ">
  <meta property="og:locale" content="en_US">
  <!-- <meta property="og:image" content="https://mayoka.dev/assets/og-image.png"> -->
  <!-- <meta property="og:image:width" content="1200"> -->
  <!-- <meta property="og:image:height" content="630"> -->

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MJ • Builder, Developer">
  <meta name="twitter:description" content="Building at the intersection of software, AI infrastructure, and entrepreneurship. Ships things that matter.">
  <!-- <meta name="twitter:image" content="https://mayoka.dev/assets/og-image.png"> -->
  <!-- <meta name="twitter:site" content="@yourhandle"> -->

  <!-- Structured Data: Person + WebSite (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://mayoka.dev/#website",
        "url": "https://mayoka.dev/",
        "name": "MJ",
        "description": "Building at the intersection of software, AI infrastructure, and entrepreneurship.",
        "publisher": { "@id": "https://mayoka.dev/#person" }
      },
      {
        "@type": "Person",
        "@id": "https://mayoka.dev/#person",
        "name": "MJ",
        "url": "https://mayoka.dev/",
        "email": "team@mayoka.dev",
        "jobTitle": "Builder · Developer",
        "description": "Building at the intersection of software, AI infrastructure, and entrepreneurship. Ships things that matter.",
        "sameAs": []
      },
      {
        "@type": "WebPage",
        "@id": "https://mayoka.dev/#homepage",
        "url": "https://mayoka.dev/",
        "name": "MJ • Builder, Developer",
        "description": "Building at the intersection of software, AI infrastructure, and entrepreneurship. Ships things that matter.",
        "isPartOf": { "@id": "https://mayoka.dev/#website" },
        "about": { "@id": "https://mayoka.dev/#person" }
      }
    ]
  }
  </script>

  <!-- Performance: Preconnect to font sources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

</head>
<body>

  <div class="gh-viewport">

    <!-- ===== Main Content ===== -->
    <main class="gh-main">
      <div class="gh-page">
        <div class="gh-container">

          <!-- Profile Section -->
          <section class="gh-profile" id="profile">
            <div class="gh-profile-avatar">
              <img src="assets/profile.png" alt="MJ Profile Picture">
            </div>
            <h1 class="gh-profile-name">
              <span class="gh-profile-title">MJ</span>
              <span class="gh-profile-subtitle"> • Builder · Developer</span>
            </h1>
          </section>

          <!-- Bio / Intro -->
          <section class="gh-intro" id="intro">
            <div class="gh-intro-content">
              <p>Building at the intersection of software, AI infrastructure, and entrepreneurship. Ships things that matter.</p>
            </div>
          </section>

          <!-- Recent Posts / Updates -->
          <section class="gh-updates" id="updates">
            <h2 class="gh-updates-title">Recent Posts</h2>
            <p class="gh-coming-soon">Coming soon.</p>
          </section>

          <!-- Newsletter / Subscribe -->
          <section class="gh-subscribe" id="subscribe">
            <h3>Stay in the loop</h3>
            <p>Get notified when new posts drop. No spam, just signal.</p>
            <form class="gh-subscribe-form" id="subscribe-form">
              <input
                type="email"
                class="gh-subscribe-input"
                id="subscribe-email"
                placeholder="your@email.com"
                required
                autocomplete="email"
              >
              <button type="submit" class="gh-subscribe-btn" id="subscribe-btn">
                Subscribe
              </button>
            </form>
            <div class="gh-subscribe-status" id="subscribe-status"></div>
          </section>

        </div>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="gh-foot" id="footer">
      <div class="gh-foot-content">
        <div class="gh-foot-message">
          📧 <a href="mailto:team@mayoka.dev">Say hi</a>
        </div>
        <div class="gh-foot-credits">
          Built by MJ
        </div>
      </div>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="js/main.js"></script>
</body>
</html>
